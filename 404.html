*{box-sizing:border-box;margin:0}
body{font:400 1.0625rem/1.55 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100svh;display:flex;flex-direction:column}

p{color:var(--ink2);font-size:1.1rem;line-height:1.5;max-width:32rem;margin:0 auto}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:2.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1.6rem;border-radius:99px;background:var(--blue);color:#fff;font:600 1rem var(--font);text-decoration:none;border:0;cursor:pointer;transition:background .15s,transform .15s}
.btn:hover{background:var(--blue-h)}.btn:active{transform:scale(.97)}
.btn.line{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}.btn.line:hover{background:var(--blue);color:#fff}
footer{background:var(--bg2);color:var(--ink2);padding:1.6rem 0;font-size:.9rem;text-align:center}
footer a{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
